<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07040d">
<title>nikich — bio</title>
<meta name="description" content="Личная страница-биография в стиле guns.lol">

<meta property="og:type" content="profile">
<meta property="og:title" content="nikich — bio">
<meta property="og:description" content="Личная страница-биография в стиле guns.lol">
<meta property="og:image" content="assets/avatar.png">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/effects.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- ==== фон ==== -->
<div class="bg" aria-hidden="true">
  <canvas id="bg-canvas"></canvas>
  <!-- Walker image: place an img that will walk across the background. Put it before other bg layers so it appears on top. -->
  <img id="walker-img" src="assets/boykisser.png" alt="фурри" aria-hidden="true" style="position:absolute;left:8%;top:60%;width:160px;height:auto;pointer-events:none;transform-origin:center center;z-index:2;image-rendering:pixelated;">
  <!-- Fallback canvas (unused by default) kept for compatibility -->
  <canvas id="walker-canvas" width="32" height="32" aria-hidden="true" style="position:absolute;left:8%;top:60%;width:160px;height:160px;image-rendering:pixelated;pointer-events:none;z-index:1;display:none;"></canvas>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-scanlines"></div>
  <div class="bg-vignette"></div>
</div>

<!-- ==== экран входа ==== -->
<div class="enter" id="enter-screen" hidden>
  <div class="enter__inner">
    <p class="enter__label">// secure connection established</p>
    <h2 class="enter__title">nikich</h2>
    <p class="enter__hint">нажми, чтобы открыть профиль</p>
    <button class="enter__btn" id="enter-btn" type="button">
      <span>войти</span>
    </button>
    <p class="enter__note">звук включится автоматически</p>
  </div>
</div>

<!-- ==== карточка профиля ==== -->
<main class="stage">
  <article class="card" id="card" tabindex="-1">

    <div class="card__corner card__corner--tl" aria-hidden="true"></div>
    <div class="card__corner card__corner--br" aria-hidden="true"></div>

    <header class="hero">
      <div class="avatar-wrap" data-reveal>
        <div class="avatar-ring" aria-hidden="true"></div>
        <img class="avatar" id="avatar" src="assets/avatar.png" alt="Аватар nikich" width="128" height="128">
        <span class="avatar-status" id="avatar-status" title="в сети"></span>
      </div>

      <div class="hero__meta">
        <h1 class="hero__name" data-reveal>
          <span id="display-name">nikich</span>
          <svg class="badge" id="badge" viewBox="0 0 24 24" aria-label="подтверждён" role="img">
            <path d="M12 1.6l2.5 2 3.2-.3.9 3.1 2.7 1.7-1.3 2.9 1.3 2.9-2.7 1.7-.9 3.1-3.2-.3-2.5 2-2.5-2-3.2.3-.9-3.1L2.2 13.9 3.5 11 2.2 8.1l2.7-1.7.9-3.1 3.2.3z"/>
            <path class="badge__tick" d="M8.2 11.6l2.6 2.6 5-5.2" fill="none"/>
          </svg>
        </h1>
        <p class="hero__handle" data-reveal id="handle">@nikich</p>
        <p class="hero__tagline" data-reveal>
          <span class="prompt" aria-hidden="true">></span>
          <span class="typewriter" id="typewriter"></span><span class="caret" aria-hidden="true"></span>
        </p>
      </div>
    </header>

    <p class="bio" id="bio" data-reveal></p>

    <ul class="facts" id="facts" data-reveal></ul>

    <section class="socials" aria-label="Социальные сети">
      <ul class="socials__list" id="socials" data-reveal></ul>
    </section>

    <section class="links" aria-label="Ссылки">
      <ul class="links__list" id="links" data-reveal></ul>
    </section>

    <footer class="card__footer">
      <ul class="stats" id="stats" data-reveal></ul>
    </footer>
  </article>

  <p class="stage__note" data-reveal>нажми на иконку, чтобы скопировать · двигай мышью по карточке</p>
</main>

<!-- ==== плеер ==== -->
<div class="player" id="player" data-reveal>
  <button class="player__toggle" id="player-toggle" type="button" aria-label="Включить музыку" aria-pressed="false">
    <svg class="player__play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
    <svg class="player__pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
  </button>
  <div class="player__meta">
    <p class="player__title" id="track-title">—</p>
    <p class="player__artist" id="track-artist">—</p>
  </div>
  <div class="player__bars" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/background.js"></script>
<script src="js/typewriter.js"></script>
<script src="js/player.js"></script>
<script src="js/counters.js"></script>
<script src="js/render.js"></script>
<script src="js/interactions.js"></script>
<script src="js/walker.js"></script>
<script src="js/app.js"></script>
</body>
</html>
